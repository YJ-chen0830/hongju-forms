<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程變更建議單 · 儒鴻 / 宏儒</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="form.css">
</head>
<body>
<div class="app">

  <aside class="panel">
    <div class="p-head">
      <a class="p-back" href="index.html">← 返回表格中心</a>
      <div class="p-title">工程變更建議單</div>
      <div class="p-sub">填寫 → 即時預覽 → 列印 / 存 PDF 送監造、主辦</div>
    </div>
    <div class="p-body">

      <div class="sec">
        <div class="sec-lbl">建議公司</div>
        <div class="field">
          <label>建議抬頭</label>
          <select id="f-brand">
            <option value="宏儒營造有限公司">宏儒營造有限公司</option>
            <option value="儒鴻結構土木技師事務所">儒鴻結構土木技師事務所</option>
          </select>
        </div>
      </div>

      <div class="sec">
        <div class="sec-lbl">單據資訊</div>
        <div class="field"><label>變更建議單號</label><input id="f-docNo" type="text"></div>
        <div class="field"><label>提出日期</label><input id="f-issueDate" type="text"></div>
      </div>

      <div class="sec">
        <div class="sec-lbl">工程資料</div>
        <div class="field"><label>工程名稱</label><input id="f-projectName" type="text"></div>
        <div class="field"><label>主辦機關</label><input id="f-owner" type="text"></div>
        <div class="field"><label>監造單位</label><input id="f-supervisor" type="text"></div>
        <div class="field"><label>承包廠商</label><input id="f-contractor" type="text"></div>
      </div>

      <div class="sec">
        <div class="sec-lbl">變更標的</div>
        <div class="field"><label>變更項目 / 部位</label><input id="f-changeItem" type="text"></div>
        <div class="field"><label>相關圖號 / 章節</label><input id="f-changeRef" type="text"></div>
      </div>

      <div class="sec">
        <div class="sec-lbl">變更類別</div>
        <div class="field"><div class="toggle"><span>設計圖說</span><div class="sw" data-t="catDrawing"></div></div></div>
        <div class="field"><div class="toggle"><span>技術規範</span><div class="sw" data-t="catSpec"></div></div></div>
        <div class="field"><div class="toggle"><span>數量增減</span><div class="sw" data-t="catQty"></div></div></div>
        <div class="field"><div class="toggle"><span>施工工法</span><div class="sw" data-t="catMethod"></div></div></div>
        <div class="field"><label>其他類別（可留空）</label><input id="f-catOther" type="text"></div>
      </div>

      <div class="sec">
        <div class="sec-lbl">變更內容</div>
        <div class="field"><label>原設計 / 原契約內容</label><textarea id="f-original" rows="3"></textarea></div>
        <div class="field"><label>建議變更為</label><textarea id="f-proposed" rows="3"></textarea></div>
        <div class="field"><label>變更理由 / 預期效益</label><textarea id="f-reason" rows="3"></textarea></div>
      </div>

      <div class="sec">
        <div class="sec-lbl">對契約之影響</div>
        <div class="field"><label>工期影響</label><input id="f-scheduleImpact" type="text" placeholder="例：增加 15 日 / 無影響"></div>
        <div class="field"><label>契約金額影響</label><input id="f-costImpact" type="text" placeholder="例：增加 NT$ 250,000 / 無影響"></div>
      </div>

      <div class="sec">
        <div class="sec-lbl">填表人</div>
        <div class="field"><label>承包廠商填表人（選填）</label><input id="f-preparedBy" type="text"></div>
      </div>

      <div class="sec">
        <div class="sec-lbl">輸出</div>
        <button class="btn btn-gold" id="btn-print" style="margin-bottom:8px;">🖨 列印 / 存成 PDF</button>
        <div class="btn-row">
          <button class="btn btn-dark" id="btn-save">💾 另存此份</button>
          <button class="btn btn-ghost" id="btn-new">＋ 開新單</button>
        </div>
      </div>

      <div class="sec">
        <div class="sec-lbl">已儲存建議單</div>
        <div id="saved-list"></div>
      </div>

    </div>
  </aside>

  <main class="stage">
    <div class="stage-chrome">
      <div class="sc-left">
        <div class="sc-kicker">Change Proposal · 工程變更建議單</div>
        <div class="sc-name" id="sc-name"></div>
        <div class="hint">左側填寫即時更新；「審核結果」欄留白供監造、主辦填列；自動記住上次內容。</div>
      </div>
    </div>
    <div class="paper" id="paper"></div>
  </main>

</div>

<script src="shared.js"></script>
<script>
(function(){
  "use strict";
  var H = window.HJ;

  function cbox(on,label){ return '<span style="display:inline-block;width:12px;height:12px;border:1.5px solid #0A1A33;border-radius:2px;vertical-align:-1px;margin-right:5px;'+(on?'background:#0A1A33;':'')+'text-align:center;line-height:11px;color:#D9B96E;font-size:9px;">'+(on?'✓':'')+'</span>'+label; }

  function defaultState(){
    return {
      brand:"宏儒營造有限公司",
      docNo:"HJ-CP-1150702-01", issueDate:"2026 / 07 / 02",
      projectName:"○○○區滯洪池及雨水下水道新建工程",
      owner:"○○市政府水利局", supervisor:"○○工程顧問股份有限公司", contractor:"宏儒營造有限公司",
      changeItem:"滯洪池放流口擋土結構", changeRef:"S-24、施工規範 03300",
      catDrawing:true, catSpec:false, catQty:true, catMethod:false, catOther:"",
      original:"原設計採 RC 重力式擋土牆，牆高 3.5 m，基礎置於原地層。",
      proposed:"建議改採加勁擋土結構，並將基礎加深 0.5 m，以因應現場實際地質狀況。",
      reason:"現場開挖後發現地層承載力不足，原設計恐有沉陷風險；變更後可提升結構安全並縮短工期。",
      scheduleImpact:"增加 10 日", costImpact:"增加 NT$ 180,000（詳估驗計價）",
      preparedBy:""
    };
  }

  var store = H.makeStore("hj_change_current","hj_change_saved",defaultState);
  var state = store.loadCur();

  function refresh(){ store.saveCur(state); render(); }

  function twoBox(labelA, valA, labelB, valB){
    function b(l,v){ return '<div style="border:1px solid #E2DDD1;border-radius:4px;overflow:hidden;">'+
      '<div style="background:#F4EFE4;padding:6px 12px;font-size:10.5px;color:#9A7B2A;font-weight:700;">'+l+'</div>'+
      '<div style="padding:10px 13px;font-size:11.5px;color:#322F27;line-height:1.75;min-height:64px;">'+(H.esc(v).replace(/\n/g,"<br>")||'<span style="color:#C2BCAD;">—</span>')+'</div></div>'; }
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">'+b(labelA,valA)+b(labelB,valB)+'</div>';
  }

  function render(){
    var cfg = H.BRANDS[state.brand] || H.BRANDS["宏儒營造有限公司"];
    document.getElementById("sc-name").textContent = cfg.brandName+"　工程變更建議單";

    var cats=[];
    cats.push(cbox(state.catDrawing,"設計圖說"));
    cats.push(cbox(state.catSpec,"技術規範"));
    cats.push(cbox(state.catQty,"數量增減"));
    cats.push(cbox(state.catMethod,"施工工法"));
    if(state.catOther) cats.push(cbox(true,H.esc(state.catOther)));

    document.getElementById("paper").innerHTML =
    '<div class="topbar"></div><div class="pad">'+
      H.docHeader(cfg,"工程變更建議單","Change Proposal",[
        ["變更建議單號", state.docNo],
        ["提出日期", state.issueDate]
      ])+
      H.projectBlock(state.projectName,[["主辦機關",state.owner],["監造單位",state.supervisor],["承包廠商",state.contractor]])+
      // 變更標的
      '<div style="margin-top:14px;border:1px solid #E2DDD1;border-radius:4px;overflow:hidden;">'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;">'+
          '<div style="padding:9px 13px;border-right:1px solid #E2DDD1;"><div style="font-size:10px;color:#9A7B2A;font-weight:600;">變更項目 / 部位</div><div style="font-size:12.5px;color:#0A1A33;font-weight:600;margin-top:3px;">'+(H.esc(state.changeItem)||"—")+'</div></div>'+
          '<div style="padding:9px 13px;"><div style="font-size:10px;color:#9A7B2A;font-weight:600;">相關圖號 / 章節</div><div style="font-size:12.5px;color:#322F27;margin-top:3px;">'+(H.esc(state.changeRef)||"—")+'</div></div>'+
        '</div>'+
        '<div style="padding:9px 13px;border-top:1px solid #E2DDD1;background:#FCFAF5;font-size:11.5px;color:#322F27;display:flex;flex-wrap:wrap;gap:7px 20px;align-items:center;"><span style="font-size:10px;color:#9A7B2A;font-weight:600;">變更類別</span>'+cats.map(function(c){return '<span>'+c+'</span>';}).join("")+'</div>'+
      '</div>'+
      H.sectionLbl("Change · 變更內容")+
      twoBox("原設計 / 原契約內容", state.original, "建議變更為", state.proposed)+
      '<div style="margin-top:12px;border:1px solid #E2DDD1;border-radius:4px;overflow:hidden;">'+
        '<div style="background:#F4EFE4;padding:6px 12px;font-size:10.5px;color:#9A7B2A;font-weight:700;">變更理由 / 預期效益</div>'+
        '<div style="padding:10px 13px;font-size:11.5px;color:#322F27;line-height:1.75;min-height:48px;">'+(H.esc(state.reason).replace(/\n/g,"<br>")||'<span style="color:#C2BCAD;">—</span>')+'</div></div>'+
      // 對契約影響
      '<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #E2DDD1;border-radius:4px;overflow:hidden;">'+
        '<div style="padding:10px 14px;border-right:1px solid #E2DDD1;"><div style="font-size:10px;color:#9A7B2A;font-weight:600;">對工期之影響</div><div style="font-size:12.5px;color:#0A1A33;font-weight:600;margin-top:3px;">'+(H.esc(state.scheduleImpact)||"—")+'</div></div>'+
        '<div style="padding:10px 14px;"><div style="font-size:10px;color:#9A7B2A;font-weight:600;">對契約金額之影響</div><div style="font-size:12.5px;color:#0A1A33;font-weight:600;margin-top:3px;">'+(H.esc(state.costImpact)||"—")+'</div></div>'+
      '</div>'+
      H.sectionLbl("Review · 審核結果（監造 / 主辦填列）")+
      '<div style="border:1px solid #E2DDD1;border-radius:4px;padding:12px 15px;background:#FBFAF6;">'+
        '<div style="font-size:12px;color:#322F27;display:flex;flex-wrap:wrap;gap:9px 26px;">'+
          '<span>'+H.box("同意辦理變更")+'</span><span>'+H.box("修正後辦理")+'</span><span>'+H.box("不同意，維持原設計")+'</span>'+
        '</div>'+
        '<div style="margin-top:11px;font-size:11px;color:#9A7B2A;font-weight:600;">審核意見</div>'+
        '<div style="border-bottom:1px solid #D8D2C4;height:20px;margin-top:6px;"></div>'+
        '<div style="border-bottom:1px solid #D8D2C4;height:20px;margin-top:9px;"></div>'+
      '</div>'+
      H.sectionLbl("Signatures · 簽核用印")+
      H.signRow([
        {role:"承包廠商（建議）", name:cfg.brandName, foot:(state.preparedBy?'填表：'+H.esc(state.preparedBy):'簽章 / 日期')},
        {role:"監造單位（審查）", name:state.supervisor},
        {role:"主辦機關（核定）", name:state.owner, bg:true}
      ])+
      H.footer(cfg,"本建議單經監造單位審查、主辦機關核定後，依契約變更程序辦理")+
    '</div>';
  }

  function renderSavedList(){
    var box=document.getElementById("saved-list"), saved=store.loadSaved(), names=Object.keys(saved);
    if(!names.length){ box.innerHTML='<div class="empty-note">尚無儲存的建議單</div>'; return; }
    box.innerHTML=""; names.sort(function(a,b){return (saved[b]._ts||0)-(saved[a]._ts||0);});
    names.forEach(function(name){
      var rec=saved[name], d=rec._ts?new Date(rec._ts):null, meta=d?(d.getMonth()+1)+"/"+d.getDate():"";
      var el=document.createElement("div"); el.className="saved-item";
      el.innerHTML='<span class="si-name" title="'+H.esc(name)+'">'+H.esc(name)+'</span><span class="si-meta">'+meta+'</span><button class="si-btn si-load" data-load="'+H.esc(name)+'">載入</button><button class="si-btn si-del" data-sdel="'+H.esc(name)+'">刪除</button>';
      box.appendChild(el);
    });
  }

  function fillForm(){
    document.getElementById("f-brand").value=state.brand;
    ["docNo","issueDate","projectName","owner","supervisor","contractor","changeItem","changeRef","catOther","original","proposed","reason","scheduleImpact","costImpact","preparedBy"].forEach(function(k){
      var el=document.getElementById("f-"+k); if(el) el.value=state[k]==null?"":state[k];
    });
    document.querySelectorAll(".sw[data-t]").forEach(function(sw){ sw.classList.toggle("on", !!state[sw.dataset.t]); });
  }

  function bind(){
    ["docNo","issueDate","projectName","owner","supervisor","contractor","changeItem","changeRef","catOther","original","proposed","reason","scheduleImpact","costImpact","preparedBy"].forEach(function(k){
      document.getElementById("f-"+k).addEventListener("input",function(e){ state[k]=e.target.value; refresh(); });
    });
    document.getElementById("f-brand").addEventListener("change",function(e){ state.brand=e.target.value; refresh(); });
    document.querySelectorAll(".sw[data-t]").forEach(function(sw){
      sw.addEventListener("click",function(){ var k=sw.dataset.t; state[k]=!state[k]; sw.classList.toggle("on",state[k]); refresh(); });
    });

    document.getElementById("btn-print").addEventListener("click",function(){ window.print(); });
    document.getElementById("btn-new").addEventListener("click",function(){
      if(!confirm("開新單會清空目前內容（已另存的不受影響），確定嗎？")) return;
      var br=state.brand, pn=state.projectName, ow=state.owner, sv=state.supervisor, ct=state.contractor;
      state=defaultState(); state.brand=br; state.projectName=pn; state.owner=ow; state.supervisor=sv; state.contractor=ct;
      state.docNo=""; state.changeItem=""; state.changeRef=""; state.catDrawing=false; state.catSpec=false; state.catQty=false; state.catMethod=false;
      state.original=""; state.proposed=""; state.reason=""; state.scheduleImpact=""; state.costImpact="";
      fillForm(); refresh();
    });
    document.getElementById("btn-save").addEventListener("click",function(){
      var sug=(state.projectName?state.projectName+"｜":"")+(state.docNo||"變更建議單");
      var name=prompt("為這份建議單命名：",sug); if(!name) return;
      var saved=store.loadSaved(), copy=JSON.parse(JSON.stringify(state)); copy._ts=Date.now();
      saved[name]=copy; store.writeSaved(saved); renderSavedList(); alert("已儲存：「"+name+"」");
    });
    document.getElementById("saved-list").addEventListener("click",function(e){
      var ld=e.target.dataset.load, dl=e.target.dataset.sdel;
      if(ld!=null){ var saved=store.loadSaved(), rec=saved[ld]; if(!rec) return; state=JSON.parse(JSON.stringify(rec)); delete state._ts; fillForm(); refresh(); }
      else if(dl!=null){ if(!confirm("刪除「"+dl+"」？")) return; var s=store.loadSaved(); delete s[dl]; store.writeSaved(s); renderSavedList(); }
    });
  }

  fillForm(); bind(); render(); renderSavedList();
})();
</script>
</body>
</html>
